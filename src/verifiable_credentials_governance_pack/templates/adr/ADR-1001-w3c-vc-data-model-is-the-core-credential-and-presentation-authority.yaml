  "tags": [],
  "summary": "The W3C Verifiable Credentials Data Model v2.0 is the core authority for credential, presentation, issuer, holder, verifier, subject, and securing-mechanism semantics.",
  "supersedes": [],
  "superseded_by": [],
  "status_notes": [],
  "references": ["https://www.w3.org/TR/vc-data-model-2.0/"],
  "body": "## Context\n\n- Downstream systems need a single baseline authority for VC and VP data model terminology.\n- Adjacent protocols can transport or request VCs, but they do not redefine the core data model.\n- Conformance claims need a clear boundary between VC data model requirements and profile-specific behavior.\n\n## Decision\n\n- The W3C Verifiable Credentials Data Model v2.0 is the core authority for baseline VC and VP data model semantics.\n- Issuer, holder, verifier, subject, credential, presentation, validity period, credential status, credential schema, securing mechanisms, and media-type requirements are governed from the data model unless a downstream profile narrows them explicitly.\n- Adjacent issuance or presentation protocols are profiled as transport and interaction layers, not as replacements for VC data model authority.\n\n## Consequences\n\n- Implementations must validate VC and VP payloads against the data model before claiming VC conformance.\n- Profile-specific documents must state which data model requirements remain inherited and which profile constraints are narrower.\n- Tests should include baseline VC and VP payloads independent of OpenID, DIF, or wallet transport behavior.\n"
