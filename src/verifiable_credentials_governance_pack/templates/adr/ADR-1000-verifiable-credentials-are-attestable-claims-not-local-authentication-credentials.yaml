  "summary": "Verifiable Credentials are governed as attestable claim containers and presentations, not as local usernames, passwords, bearer tokens, or session credentials.",
  "supersedes": [],
  "superseded_by": [],
  "status_notes": [],
  "references": ["https://www.w3.org/TR/vc-data-model-2.0/"],
  "body": "## Context\n\n- The Verifiable Credentials data model defines credentials, presentations, issuers, holders, verifiers, claims, subjects, and securing mechanisms.\n- Application authentication systems often use the word credential for passwords, API keys, bearer tokens, or local account secrets.\n- Treating Verifiable Credentials as local authentication credentials creates incorrect security assumptions and weakens downstream governance.\n\n## Decision\n\n- Verifiable Credentials are governed as attestable claim containers that can be cryptographically secured and presented to verifiers.\n- Local authentication credentials, session tokens, and authorization secrets are outside baseline VC scope unless a downstream profile explicitly maps them to VC issuance or presentation behavior.\n- Verification of a VC establishes authenticity, integrity, status, and policy fitness for use; it does not by itself create a local authenticated session.\n\n## Consequences\n\n- Implementations must keep VC verification policy separate from login, session, and access-control policy.\n- Tests should distinguish successful VC verification from local authentication success.\n- Documentation must avoid using VC terminology to imply password, bearer-token, or session-token semantics.\n"
