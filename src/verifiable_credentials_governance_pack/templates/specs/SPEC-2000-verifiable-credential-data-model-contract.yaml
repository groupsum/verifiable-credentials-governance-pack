  "status_notes": [],
  "references": ["https://www.w3.org/TR/vc-data-model-2.0/"],
  "body": "## Requirements\n\n- Implementations must declare the VC data model version they support.\n- VC processing must validate required credential properties, issuer semantics, subject claims, validity periods, credential status declarations, credential schema declarations, and securing mechanisms according to the supported data model.\n- Verification must distinguish authenticity, integrity, status, freshness, schema fitness, and verifier business policy.\n- VC verification must not automatically create a local authenticated session or authorization grant.\n\n## Evidence Expectations\n\n- Positive fixtures for conforming credentials using declared media types and securing mechanisms.\n- Negative fixtures for missing required fields, wrong types, unsupported contexts, unsupported media types, and unsecured credentials.\n- Evidence showing separate outcomes for payload validity, cryptographic verification, status checking, and verifier policy acceptance.\n"
